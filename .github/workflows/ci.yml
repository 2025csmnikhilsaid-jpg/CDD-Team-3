name: CampusConnect CI Pipeline

on:
  push:
    branches: [main, develop, feature/backend]
  pull_request:
    branches: [main, develop]

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Backend
        run: python -m compileall -q backend

      - name: Run Automated Tests
        run: |
          if [ -d tests ] && find tests -name "test_*.py" -print -quit | grep -q .; then
            pytest -q
          else
            echo "No automated tests found. Skipping."
          fi

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: backend-validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t campusconnect-backend:ci .