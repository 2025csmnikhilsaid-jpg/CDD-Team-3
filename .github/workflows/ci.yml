name: CareerSphere CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python Files
        run: python -m compileall -q backend

      - name: Run All Backend Tests
        run: python -m pytest -v

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript Files
        run: |
          find frontend/frontend -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check

      - name: Verify Frontend Files
        run: |
          test -f frontend/frontend/index.html
          test -f frontend/frontend/login.html
          test -f frontend/frontend/register.html
          test -f frontend/frontend/nginx.conf
          echo "Frontend files verified successfully."

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - frontend-validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t careersphere-backend:ci -f Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t careersphere-frontend:ci -f frontend/frontend/Dockerfile frontend/frontend
